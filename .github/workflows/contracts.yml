name: Foundry decision contracts
on:
  pull_request:
    paths:
      - 'decision_tree.py'
      - 'tests/**'
      - '.github/workflows/contracts.yml'
permissions:
  contents: read
concurrency:
  group: decision-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic contracts
        run: python -m pytest -q tests/test_contracts.py
