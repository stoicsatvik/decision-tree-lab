name: Foundry decision contracts
on:
  pull_request:
    paths:
      - 'decision_tree.py'
      - 'tests/**'
      - '.github/workflows/contracts.yml'
permissions:
  contents: read
concurrency:
  group: decision-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic contracts
        run: |
          python - <<'PY'
          import inspect
          import tests.test_contracts as contracts

          tests = sorted(
              (name, fn)
              for name, fn in vars(contracts).items()
              if name.startswith("test_") and inspect.isfunction(fn)
          )
          if not tests:
              raise SystemExit("no deterministic contracts discovered")
          for name, fn in tests:
              fn()
              print(f"PASS {name}")
          print(f"{len(tests)} deterministic contracts passed")
          PY
